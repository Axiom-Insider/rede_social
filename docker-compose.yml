
services:

  app:
    build: .
    container_name: rede_social_php

    restart: always

    ports:
      - "8080:80"

    env_file:
      - .env

    volumes:
      - .:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: rede_social_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rede_social
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
